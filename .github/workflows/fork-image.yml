# Fork image workflow: builds and publishes the container image to GHCR.
#
# Tag schema: fork-<upstream-version>-<n>, e.g. fork-1.9.0-1.
# The tag deliberately does not start with "v", so the upstream release.yml
# workflow (triggers on tags "v*") never fires for fork tags.
#
# A tag push (or a manual dispatch) runs the full check suite, builds a local
# linux/amd64 image, smoke-tests it, then builds and pushes the multi-arch
# image to GHCR and creates a GitHub release for the tag.
name: Fork Image

on:
  push:
    tags:
      - 'fork-*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build smoke-test image (linux/amd64 only)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ris-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: bash scripts/fork/smoke-test.sh ris-mcp:smoke

      - name: Build and push multi-arch image
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:stable
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
