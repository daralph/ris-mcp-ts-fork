# Diesen Block in die bestehende librechat.yaml einfügen (keine vollständige Datei),
# danach den Container `api` neu starten.

# Pflicht: Sonst blockiert der SSRF-Schutz der LibreChat interne Dienstnamen
# ("Domain ... is not allowed"), und der Server erscheint mit 0 Tools.
mcpSettings:
  allowedAddresses:
    - 'ris-mcp:3000'

mcpServers:
  ris:
    type: streamable-http
    url: http://ris-mcp:3000/mcp
    timeout: 60000
    initTimeout: 15000
    # Bietet den Server allen Nutzer:innen im MCP-Menü des Chats an.
    chatMenu: true
    requiresOAuth: false
    # Gibt dem Modell die Gebrauchsanweisung des Servers mit (welches Tool wofür,
    # wie zitieren). Die paar hundert Tokens lohnen sich.
    serverInstructions: true
    # Nur mit gesetztem RIS_MCP_AUTH_TOKEN; sonst diese zwei Zeilen löschen.
    headers:
      Authorization: "Bearer ${RIS_MCP_AUTH_TOKEN}"
