# Neben die docker-compose.yml der LibreChat legen (Docker Compose bindet die
# Override-Datei automatisch ein).
#
# Zwei optionale Variablen in der .env der LibreChat:
#   RIS_MCP_IMAGE_TAG   Image-Tag (Standard: stable); für nachvollziehbare Stände
#                       einen festen Tag setzen, z. B. fork-1.9.0-1
#   RIS_MCP_AUTH_TOKEN  Bearer-Token für /mcp; leer = ohne Token (der Dienst ist
#                       nur im Compose-Netz erreichbar)
services:
  api:
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml

  ris-mcp:
    image: ghcr.io/daralph/ris-mcp-ts-fork:${RIS_MCP_IMAGE_TAG:-stable}
    # Alternative: aus einem lokalen Checkout bauen, statt das Image zu ziehen.
    # build: ../ris-mcp-ts-fork
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    pids_limit: 128
    # Kein "ports:": LibreChat erreicht den Dienst im Compose-Netz unter
    # http://ris-mcp:3000/mcp, sonst niemand.
    environment:
      # LibreChat stellt keine interaktiven Ansichten dar, und alle Nutzer:innen
      # kommen von einer IP.
      MCP_STATELESS: 'true'
      RATE_LIMIT_PER_MINUTE: '600'
      # Optional. RIS_MCP_AUTH_TOKEN auch in die .env der LibreChat eintragen,
      # damit die librechat.yaml darauf verweisen kann.
      MCP_AUTH_TOKEN: ${RIS_MCP_AUTH_TOKEN:-}
