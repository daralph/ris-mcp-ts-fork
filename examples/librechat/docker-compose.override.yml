# Drop next to LibreChat's docker-compose.yml (Docker Compose merges the override
# automatically).
#
# Two optional variables, set in LibreChat's own .env:
#   RIS_MCP_IMAGE_TAG   image tag to run (default: stable); pin a release tag
#                       such as fork-1.9.0-1 for reproducible deployments
#   RIS_MCP_AUTH_TOKEN  bearer token for /mcp; leave unset to run without one
#                       (the service is only reachable inside the compose network)
services:
  api:
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml

  ris-mcp:
    image: ghcr.io/daralph/ris-mcp-ts-fork:${RIS_MCP_IMAGE_TAG:-stable}
    # Alternative: build from a local checkout instead of pulling the image.
    # build: ../ris-mcp-ts-fork
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    pids_limit: 128
    # No "ports:" — LibreChat reaches it as http://ris-mcp:3000/mcp inside the
    # compose network, and nothing else can.
    environment:
      # LibreChat has no interactive widget and serves many users from one IP.
      MCP_STATELESS: 'true'
      RATE_LIMIT_PER_MINUTE: '600'
      # Optional. Also add RIS_MCP_AUTH_TOKEN to LibreChat's .env so that
      # librechat.yaml can reference it (see below).
      MCP_AUTH_TOKEN: ${RIS_MCP_AUTH_TOKEN:-}
